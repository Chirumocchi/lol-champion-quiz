<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09141b"><title>LoL Champion Quiz</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f0e6d2;background:#09141b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#183041,#09141b 65%)}main{max-width:520px;margin:auto;padding:24px 16px 48px}.brand{text-align:center;color:#c8aa6e;letter-spacing:.18em;font-size:12px}.heading{text-align:center;font-size:29px;font-weight:800;margin:12px 0 25px}.panel{border:1px solid #785a28;background:#101e29;border-radius:12px;padding:20px;box-shadow:0 12px 36px #0005}.meta{display:flex;justify-content:space-between;color:#c8aa6e;font-size:13px}.progress{height:5px;background:#263c48;margin:12px 0 24px;border-radius:5px;overflow:hidden}.bar{height:100%;background:#c8aa6e;width:0%;transition:width .2s}.mode{text-align:center;color:#a9b8c2;font-size:13px;margin-bottom:12px}.skill{text-align:center;font-size:25px;font-weight:700;margin:8px 0 12px}.desc{text-align:center;color:#d4d9dc;line-height:1.7;font-size:14px;white-space:pre-line}.icon{display:block;width:88px;height:88px;margin:14px auto;border:2px solid #c8aa6e;border-radius:8px;object-fit:cover}.field{width:100%;margin:22px 0 10px;padding:15px;background:#09141b;border:1px solid #785a28;color:white;border-radius:6px;font-size:17px;outline:none}.field:focus{border-color:#e6c887}button{width:100%;border:1px solid #c8aa6e;background:linear-gradient(135deg,#80602b,#b99a57);color:#101820;font-weight:800;padding:14px;border-radius:6px;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:transparent;color:#c8aa6e;margin-top:10px}.feedback{text-align:center;line-height:1.7;margin-top:14px}.good{color:#69d9a1}.bad{color:#ff9b91}.answerIcon{width:54px;height:54px;vertical-align:middle;border-radius:6px;margin:8px}.foot{text-align:center;font-size:11px;color:#89969b;margin-top:25px;line-height:1.6}select{background:#09141b;color:#f0e6d2;border:1px solid #785a28;padding:9px;border-radius:5px;width:100%;margin-bottom:12px}label{font-size:13px;color:#c8aa6e}#status{text-align:center;line-height:1.8;color:#c8aa6e}#game{display:none}.suggestions{max-height:170px;overflow:auto;margin:-5px 0 12px;border:1px solid #785a28;border-radius:6px;background:#0b1822}.suggestions button{display:block;text-align:left;background:transparent;color:#f0e6d2;border:0;border-bottom:1px solid #34414a;border-radius:0;padding:10px 12px;font-weight:500}.reveal{text-align:center;margin-top:14px;color:#c8aa6e}.reveal img{width:76px;height:76px;object-fit:cover;border:1px solid #c8aa6e;border-radius:8px;display:block;margin:8px auto}#review{margin-top:8px}</style></head><body><main><div class="brand">LEAGUE OF LEGENDS</div><div class="heading">CHAMPION QUIZ <span style="font-size:11px;color:#c8aa6e">v0.2</span></div><section class="panel" id="loading"><div id="status">公式データを読み込んでいます…</div><button id="retry" class="secondary" style="display:none">再試行</button></section><section class="panel" id="game"><div class="meta"><span id="count">QUESTION 1 / 10</span><span id="score">SCORE 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><label for="kind">出題形式</label><select id="kind"><option value="mix">ランダム</option><option value="name">スキル名</option><option value="icon">スキルアイコン</option><option value="desc">スキル説明</option></select><label for="limit">出題数</label><select id="limit"><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option></select><div class="mode" id="mode"></div><img id="skillIcon" class="icon" alt="スキルアイコン" hidden><div id="skillName" class="skill"></div><div id="skillDesc" class="desc"></div><form id="form"><input id="guess" class="field" placeholder="チャンピオン名を入力" autocomplete="off" enterkeyhint="done" required><div id="suggestions" class="suggestions" hidden></div><button id="submit">回答する</button></form><div class="feedback" id="feedback" aria-live="polite"></div><div id="reveal" class="reveal" hidden></div><button id="next" class="secondary" style="display:none">次の問題へ</button><button id="review" class="secondary" style="display:none">間違えた問題を復習</button></section><div class="foot">Unofficial fan project. Not endorsed by Riot Games.<br>Game data and images © Riot Games.</div></main><script>
'use strict';
const base='https://ddragon.leagueoflegends.com', $=id=>document.getElementById(id);
let champions=[],pool=[],deck=[],question=null,index=0,score=0,answered=false,version='',missed=[],reviewing=false,sessionLimit=10;
const clean=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/\{\{[^}]*\}\}/g,'').replace(/\s+/g,' ').trim();
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s・･.'’\-_]/g,'');
function hideName(s,name){let out=clean(s);if(name)out=out.replaceAll(name,'このチャンピオン');return out}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){try{$('retry').style.display='none';$('status').textContent='パッチ情報を取得中…';version=(await json(base+'/api/versions.json'))[0];const summary=await json(`${base}/cdn/${version}/data/ja_JP/champion.json`);champions=Object.values(summary.data);const ids=Object.keys(summary.data);let cursor=0,done=0;const collected=[];
async function worker(){while(cursor<ids.length){const id=ids[cursor++];try{const detail=await json(`${base}/cdn/${version}/data/ja_JP/champion/${encodeURIComponent(id)}.json`);const c=detail.data[id];if(c){const spells=[{slot:'P',...c.passive},...c.spells.map((s,i)=>({slot:['Q','W','E','R'][i],...s}))];for(const sp of spells){if(!sp?.name)continue;const image=sp.image?.full;collected.push({champion:c.name,id:c.id,slot:sp.slot,name:sp.name,description:hideName(sp.description,c.name),icon:image?`${base}/cdn/${version}/img/${sp.slot==='P'?'passive':'spell'}/${encodeURIComponent(image)}`:null,portrait:`${base}/cdn/${version}/img/champion/${encodeURIComponent(c.image.full)}`})}}}catch(e){console.warn('Skipped',id,e)}done++;$('status').textContent=`スキルを取得中… ${done} / ${ids.length}`}}
await Promise.all(Array.from({length:7},worker));pool=collected.filter(s=>s.name||s.description||s.icon);if(pool.length<20)throw Error('スキル情報が不足しています');$('loading').style.display='none';$('game').style.display='block';start(false)}catch(e){$('status').textContent='読み込みに失敗しました。通信環境を確認して再試行してください。 '+e.message;$('retry').style.display='block'}}
function start(review){reviewing=review;index=0;score=0;answered=false;$('kind').disabled=false;$('limit').disabled=false;if(!review)missed=[];sessionLimit=review?missed.length:Number($('limit').value);deck=review?shuffle([...missed]):shuffle([...pool]).slice(0,sessionLimit);$('form').style.display='block';$('review').style.display='none';$('next').onclick=advance;nextQuestion()}
function nextQuestion(){if(index>=deck.length){$('mode').textContent=reviewing?'復習結果':'結果発表';$('skillName').textContent=`${score} / ${deck.length} 正解！`;$('skillDesc').textContent=`正答率 ${Math.round(score/deck.length*100)}%`;$('skillIcon').hidden=true;$('form').style.display='none';$('suggestions').hidden=true;$('reveal').hidden=true;$('next').style.display='block';$('next').textContent='新しいクイズを始める';$('next').onclick=()=>start(false);$('review').style.display=!reviewing&&missed.length?'block':'none';$('feedback').textContent='';$('count').textContent='FINISH';$('score').textContent='SCORE '+score;$('bar').style.width='100%';return}
answered=false;question=deck[index];const requested=$('kind').value;let mode=requested==='mix'?shuffle(['name','icon','desc'])[0]:requested;if(mode==='icon'&&!question.icon)mode='name';if(mode==='desc'&&!question.description)mode='name';$('count').textContent=`QUESTION ${index+1} / ${deck.length}`;$('score').textContent='SCORE '+score;$('bar').style.width=(index/deck.length*100)+'%';$('mode').textContent={name:'このスキル名を持つチャンピオンは？',icon:'このアイコンのスキルを持つチャンピオンは？',desc:'このスキル説明に当てはまるチャンピオンは？'}[mode];$('skillName').textContent=mode==='name'?question.name:'';$('skillDesc').textContent=mode==='desc'?question.description:'';$('skillIcon').hidden=mode!=='icon';if(mode==='icon')$('skillIcon').src=question.icon;$('feedback').textContent='';$('guess').value='';$('guess').disabled=false;$('submit').disabled=false;$('suggestions').hidden=true;$('reveal').hidden=true;$('next').style.display='none';$('kind').disabled=index>0;$('limit').disabled=index>0}
function suggest(){const value=norm($('guess').value);const box=$('suggestions');box.replaceChildren();if(!value||answered){box.hidden=true;return}const matches=champions.filter(c=>norm(c.name).includes(value)||norm(c.id).includes(value)).slice(0,7);for(const c of matches){const b=document.createElement('button');b.type='button';b.textContent=c.name;b.onclick=()=>{$('guess').value=c.name;box.hidden=true;$('guess').focus()};box.appendChild(b)}box.hidden=!matches.length}
function check(e){e.preventDefault();if(answered)return;const guess=$('guess').value.trim();if(!guess)return;answered=true;const correct=norm(guess)===norm(question.champion)||norm(guess)===norm(question.id);if(correct)score++;else if(!reviewing)missed.push(question);$('score').textContent='SCORE '+score;$('feedback').className='feedback '+(correct?'good':'bad');$('feedback').textContent=correct?'正解！ '+question.champion:'不正解。正解は '+question.champion;$('reveal').replaceChildren();const img=document.createElement('img');img.src=question.portrait;img.alt=question.champion;const caption=document.createElement('div');caption.textContent=`${question.champion} — ${question.slot}: ${question.name}`;$('reveal').append(img,caption);$('reveal').hidden=false;$('guess').disabled=true;$('submit').disabled=true;$('suggestions').hidden=true;$('next').style.display='block';$('next').textContent=index===deck.length-1?'結果を見る':'次の問題へ'}
function advance(){index++;nextQuestion()}
$('form').addEventListener('submit',check);$('guess').addEventListener('input',suggest);$('next').onclick=advance;$('retry').onclick=load;$('review').onclick=()=>start(true);$('kind').onchange=()=>start(false);$('limit').onchange=()=>start(false);load();
</script></body></html>
