<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09141b"><title>LoL Champion Quiz</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f0e6d2;background:#09141b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#183041,#09141b 65%)}main{max-width:520px;margin:auto;padding:24px 16px 48px}.brand{text-align:center;color:#c8aa6e;letter-spacing:.18em;font-size:12px}.heading{text-align:center;font-size:29px;font-weight:800;margin:12px 0 25px}.panel{border:1px solid #785a28;background:#101e29;border-radius:12px;padding:20px;box-shadow:0 12px 36px #0005}.meta{display:flex;justify-content:space-between;color:#c8aa6e;font-size:13px}.progress{height:5px;background:#263c48;margin:12px 0 24px;border-radius:5px;overflow:hidden}.bar{height:100%;background:#c8aa6e;width:0%;transition:width .2s}.mode{text-align:center;color:#a9b8c2;font-size:13px;margin-bottom:12px}.skill{text-align:center;font-size:25px;font-weight:700;margin:8px 0 12px}.desc{text-align:center;color:#d4d9dc;line-height:1.7;font-size:14px;white-space:pre-line}.icon{display:block;width:88px;height:88px;margin:14px auto;border:2px solid #c8aa6e;border-radius:8px;object-fit:cover}.field{width:100%;margin:22px 0 10px;padding:15px;background:#09141b;border:1px solid #785a28;color:white;border-radius:6px;font-size:17px;outline:none}.field:focus{border-color:#e6c887}button{width:100%;border:1px solid #c8aa6e;background:linear-gradient(135deg,#80602b,#b99a57);color:#101820;font-weight:800;padding:14px;border-radius:6px;font-size:16px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:transparent;color:#c8aa6e;margin-top:10px}.feedback{text-align:center;line-height:1.7;margin-top:14px}.good{color:#69d9a1}.bad{color:#ff9b91}.answerIcon{width:54px;height:54px;vertical-align:middle;border-radius:6px;margin:8px}.foot{text-align:center;font-size:11px;color:#89969b;margin-top:25px;line-height:1.6}select{background:#09141b;color:#f0e6d2;border:1px solid #785a28;padding:9px;border-radius:5px;width:100%;margin-bottom:12px}label{font-size:13px;color:#c8aa6e}#status{text-align:center;line-height:1.8;color:#c8aa6e}#game{display:none}.suggestions{max-height:170px;overflow:auto;margin:-5px 0 12px;border:1px solid #785a28;border-radius:6px;background:#0b1822}.suggestions button{display:block;text-align:left;background:transparent;color:#f0e6d2;border:0;border-bottom:1px solid #34414a;border-radius:0;padding:10px 12px;font-weight:500}[hidden]{display:none!important}.reveal{text-align:center;margin-top:14px;color:#c8aa6e}.reveal img{width:76px;height:76px;object-fit:cover;border:1px solid #c8aa6e;border-radius:8px;display:block;margin:8px auto}#review{margin-top:8px}
/* v0.3 visual system */
:root{--gold:#c8aa6e;--bright:#f0d99b;--deep:#07131c;--teal:#0ac8b9}
body{background:radial-gradient(ellipse at 50% -10%,#244454 0%,#0a1a27 43%,#050c13 100%);background-attachment:fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(circle at 15% 15%,#c8aa6e 1px,transparent 2px),radial-gradient(circle at 85% 32%,#0ac8b9 1px,transparent 2px),radial-gradient(circle at 54% 75%,#c8aa6e 1px,transparent 2px);background-size:185px 210px,260px 240px,320px 280px;animation:drift 25s linear infinite}
main{position:relative;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(50px,env(safe-area-inset-bottom))}
.brand{font-size:10px;letter-spacing:.35em;color:#b7a47b}
.heading{font-family:Georgia,serif;font-size:clamp(26px,7vw,37px);letter-spacing:.035em;text-shadow:0 2px 22px #c8aa6e3a;margin:12px 0 24px}
.heading span{font-family:system-ui;vertical-align:middle}
.panel{position:relative;overflow:visible;border:1px solid #94743e;border-radius:3px;background:linear-gradient(160deg,#142935 0%,#0b1925 52%,#09151e 100%);box-shadow:0 0 0 3px #08121b,0 0 0 4px #554528,0 22px 65px #0009;padding:22px 19px 25px}
.panel:before,.panel:after{content:"◆";position:absolute;color:#e5c88b;font-size:12px;text-shadow:0 0 12px #d3b36c;top:-10px}.panel:before{left:10px}.panel:after{right:10px}
.meta{font-size:12px;font-weight:700;letter-spacing:.1em}.progress{height:7px;background:#0a111a;border:1px solid #5a4a30;margin:15px 0 20px;border-radius:0}.bar{background:linear-gradient(90deg,#80602b,#f4da91,#c8aa6e);box-shadow:0 0 12px #d2ac56aa;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mode{letter-spacing:.05em;font-size:13px;margin:20px 0 15px;color:#a9c7d1}
.skill{font-family:Georgia,serif;font-size:clamp(24px,6vw,32px);color:#f3e5c7;text-shadow:0 0 18px #c8aa6e44;line-height:1.35}
.desc{background:#07131b99;border-left:2px solid #785a28;border-right:2px solid #785a28;padding:15px 12px;max-height:260px;overflow:auto}
.icon{width:110px;height:110px;border:2px solid #d7b971;border-radius:3px;box-shadow:0 0 0 5px #142634,0 0 25px #c8aa6e55;margin:22px auto;animation:float 3s ease-in-out infinite}
.field{border-radius:2px;background:#06111b;border:1px solid #735c36;box-shadow:inset 0 0 15px #0007;transition:border-color .2s,box-shadow .2s}.field:focus{border-color:#e4c779;box-shadow:0 0 0 2px #c8aa6e22,0 0 16px #c8aa6e22}
button{border-radius:2px;min-height:48px;letter-spacing:.04em;background:linear-gradient(125deg,#9b793d,#e1c17a 48%,#a17d3c);box-shadow:inset 0 0 0 1px #f6db9b55;transition:filter .15s,transform .15s}button:active{transform:scale(.985);filter:brightness(1.12)}.secondary{background:#091b27;border:1px solid #8c6d3d;color:#ead39c;box-shadow:inset 0 0 0 1px #172b36}
select{border-radius:2px;background:#071722;border-color:#725d39;min-height:42px}label{letter-spacing:.05em}.suggestions{border-radius:2px;box-shadow:0 12px 24px #0008}.suggestions button{min-height:44px;box-shadow:none;letter-spacing:0}
.feedback{min-height:25px;font-weight:700}.good{text-shadow:0 0 14px #3bd9a666}.bad{text-shadow:0 0 12px #ff585855}
#attempts{display:flex;justify-content:center;gap:9px;margin:15px auto 5px}#attempts span{width:26px;height:7px;transform:skew(-25deg);background:#15313a;border:1px solid #52636a;transition:background .2s,box-shadow .2s}#attempts span.used{background:#a84644;border-color:#f28278;box-shadow:0 0 9px #ff4e4e77}
#attemptLabel{text-align:center;color:#a8b8c0;font-size:11px;letter-spacing:.12em;margin-bottom:3px}
.reveal{border-top:1px solid #65502c;padding-top:12px;animation:rise .45s ease both}.reveal img{width:98px;height:98px;border-radius:2px;box-shadow:0 0 24px #c8aa6e55}
#game{animation:rise .45s ease both}.question-enter{animation:rise .42s ease both}.shake{animation:shake .34s ease}.victory{animation:winGlow .85s ease}.result-score{font-size:48px;font-family:Georgia,serif;color:#e7cd8b;text-shadow:0 0 24px #d2a95b88}.result-sub{color:#b8cdd4;font-size:15px;margin-top:8px}
.foot{opacity:.8}.mini-separator{text-align:center;color:#9d7b40;letter-spacing:.5em;margin:0 0 16px;font-size:12px}
@keyframes drift{to{background-position:185px 210px,-260px 240px,320px -280px}}@keyframes float{50%{transform:translateY(-5px);box-shadow:0 0 0 5px #142634,0 0 34px #c8aa6e88}}@keyframes rise{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}@keyframes winGlow{30%{box-shadow:0 0 0 3px #08121b,0 0 0 4px #e2c478,0 0 55px #c8aa6e99}100%{box-shadow:0 0 0 3px #08121b,0 0 0 4px #554528,0 22px 65px #0009}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="brand">LEAGUE OF LEGENDS</div><div class="heading">CHAMPION QUIZ <span style="font-size:11px;color:#c8aa6e">v0.3.0</span></div><section class="panel" id="loading"><div id="status">公式データを読み込んでいます…</div><button id="retry" class="secondary" style="display:none">再試行</button></section><section class="panel" id="game"><div class="meta"><span id="count">QUESTION 1 / 10</span><span id="score">SCORE 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><label for="kind">出題形式</label><select id="kind"><option value="mix">ランダム</option><option value="name">スキル名</option><option value="icon">スキルアイコン</option><option value="desc">スキル説明</option></select><label for="limit">出題数</label><select id="limit"><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option></select><div class="mini-separator" aria-hidden="true">◆ ◇ ◆</div><div class="mode" id="mode"></div><img id="skillIcon" class="icon" alt="スキルアイコン" hidden><div id="skillName" class="skill"></div><div id="skillDesc" class="desc"></div><form id="form"><input id="guess" class="field" placeholder="チャンピオン名を入力（最大6回）" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" required><div id="suggestions" class="suggestions" hidden></div><button id="submit">回答する</button></form><div id="attempts" aria-label="誤答回数"></div><div id="attemptLabel">CHANCES REMAINING · 6</div><div class="feedback" id="feedback" aria-live="polite"></div><div id="reveal" class="reveal" hidden></div><button id="next" class="secondary" style="display:none">次の問題へ</button><button id="review" class="secondary" style="display:none">間違えた問題を復習</button></section><div class="foot">Unofficial fan project. Not endorsed by Riot Games.<br>Game data and images © Riot Games.</div></main><script>
'use strict';
const base='https://ddragon.leagueoflegends.com', $=id=>document.getElementById(id);
let champions=[],pool=[],deck=[],question=null,index=0,score=0,answered=false,version='',missed=[],reviewing=false,sessionLimit=10,wrongAttempts=0;
const clean=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/\{\{[^}]*\}\}/g,'').replace(/\s+/g,' ').trim();
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s・･.'’\-_]/g,'');
const alias={'ウーコン':'モンキーキング','ヌヌ':'ヌヌ＆ウィルンプ','ヌヌとウィルンプ':'ヌヌ＆ウィルンプ'};
function matchesChampion(input,c){const n=norm(input);return n===norm(c.name)||n===norm(c.id)||Object.entries(alias).some(([a,b])=>n===norm(a)&&norm(c.name)===norm(b))}
function clearImage(img){img.onload=null;img.onerror=null;img.hidden=true;img.removeAttribute('src');img.dataset.failed='0';img.dataset.request=String((Number(img.dataset.request)||0)+1)}
function setImage(img,url){
  clearImage(img);
  if(!url)return;
  const request=img.dataset.request;
  const expected=url;
  img.onload=()=>{if(img.dataset.request===request&&img.getAttribute('src')===expected)img.hidden=false};
  img.onerror=()=>{if(img.dataset.request!==request)return;img.hidden=true;img.dataset.failed='1';if(img.id==='skillIcon')$('skillDesc').textContent='アイコンを取得できませんでした。次の問題へ進んでください。'};
  img.src=url;
}

function updateAttempts(){const box=$('attempts');box.replaceChildren();for(let i=0;i<6;i++){const pip=document.createElement('span');if(i<wrongAttempts)pip.className='used';box.appendChild(pip)}$('attemptLabel').textContent='CHANCES REMAINING · '+Math.max(0,6-wrongAttempts)}
function animateOnce(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true})}
function hideName(s,name){let out=clean(s);if(name)out=out.replaceAll(name,'このチャンピオン');return out}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function load(){try{$('retry').style.display='none';$('status').textContent='パッチ情報を取得中…';version=(await json(base+'/api/versions.json'))[0];const summary=await json(`${base}/cdn/${version}/data/ja_JP/champion.json`);champions=Object.values(summary.data);const ids=Object.keys(summary.data);let cursor=0,done=0;const collected=[];
async function worker(){while(cursor<ids.length){const id=ids[cursor++];try{const detail=await json(`${base}/cdn/${version}/data/ja_JP/champion/${encodeURIComponent(id)}.json`);const c=detail.data[id];if(c){const spells=[{slot:'P',...c.passive},...c.spells.map((s,i)=>({slot:['Q','W','E','R'][i],...s}))];for(const sp of spells){if(!sp?.name)continue;const image=sp.image?.full;collected.push({champion:c.name,id:c.id,slot:sp.slot,name:sp.name,description:hideName(sp.description,c.name),icon:image?`${base}/cdn/${version}/img/${sp.slot==='P'?'passive':'spell'}/${encodeURIComponent(image)}`:null,portrait:`${base}/cdn/${version}/img/champion/${encodeURIComponent(c.image.full)}`})}}}catch(e){console.warn('Skipped',id,e)}done++;$('status').textContent=`スキルを取得中… ${done} / ${ids.length}`}}
await Promise.all(Array.from({length:7},worker));pool=collected.filter(s=>s.name||s.description||s.icon);if(pool.length<20)throw Error('スキル情報が不足しています');$('loading').style.display='none';$('game').style.display='block';start(false)}catch(e){$('status').textContent='読み込みに失敗しました。通信環境を確認して再試行してください。 '+e.message;$('retry').style.display='block'}}
function start(review){reviewing=review;index=0;score=0;answered=false;$('kind').disabled=false;$('limit').disabled=false;if(!review)missed=[];sessionLimit=review?missed.length:Number($('limit').value);deck=review?shuffle([...missed]):shuffle([...pool]).slice(0,sessionLimit);$('form').style.display='block';$('review').style.display='none';$('next').onclick=advance;nextQuestion()}
function nextQuestion(){clearImage($('skillIcon'));$('reveal').replaceChildren();$('reveal').hidden=true;if(index>=deck.length){$('mode').textContent=reviewing?'復習結果':'結果発表';$('skillName').innerHTML=`<div class="result-score">${score} / ${deck.length}</div><div class="result-sub">正解！</div>`;$('skillDesc').textContent=`正答率 ${Math.round(score/deck.length*100)}%`;$('skillIcon').hidden=true;$('form').style.display='none';$('attempts').hidden=true;$('attemptLabel').hidden=true;$('suggestions').hidden=true;$('reveal').hidden=true;$('next').style.display='block';$('next').textContent='新しいクイズを始める';$('next').onclick=()=>start(false);$('review').style.display=!reviewing&&missed.length?'block':'none';$('feedback').textContent='';$('count').textContent='FINISH';$('score').textContent='SCORE '+score;$('bar').style.width='100%';return}
answered=false;wrongAttempts=0;updateAttempts();$('attempts').hidden=false;$('attemptLabel').hidden=false;animateOnce($('game'),'question-enter');question=deck[index];const requested=$('kind').value;let mode=requested==='mix'?shuffle(['name','icon','desc'])[0]:requested;if(mode==='icon'&&!question.icon)mode='name';if(mode==='desc'&&!question.description)mode='name';$('count').textContent=`QUESTION ${index+1} / ${deck.length}`;$('score').textContent='SCORE '+score;$('bar').style.width=(index/deck.length*100)+'%';$('mode').textContent={name:'このスキル名を持つチャンピオンは？',icon:'このアイコンのスキルを持つチャンピオンは？',desc:'このスキル説明に当てはまるチャンピオンは？'}[mode];$('skillName').textContent=mode==='name'?question.name:'';$('skillDesc').textContent=mode==='desc'?question.description:'';if(mode==='icon')setImage($('skillIcon'),question.icon);$('feedback').textContent='';$('guess').value='';$('guess').disabled=false;$('submit').disabled=false;$('suggestions').hidden=true;$('reveal').hidden=true;$('next').style.display='none';$('kind').disabled=index>0;$('limit').disabled=index>0}
function suggest(){const value=norm($('guess').value);const box=$('suggestions');box.replaceChildren();if(!value||answered){box.hidden=true;return}const matches=champions.filter(c=>norm(c.name).includes(value)||norm(c.id).includes(value)).slice(0,7);for(const c of matches){const b=document.createElement('button');b.type='button';b.textContent=c.name;b.onclick=()=>{$('guess').value=c.name;box.hidden=true;$('guess').focus()};b.onpointerdown=ev=>ev.preventDefault();box.appendChild(b)}box.hidden=!matches.length}
function check(e){
 e.preventDefault();if(answered)return;
 const guess=$('guess').value.trim();if(!guess)return;
 const correct=matchesChampion(guess,{name:question.champion,id:question.id});
 if(!correct){
   wrongAttempts++;updateAttempts();animateOnce($('game'),'shake');
   $('suggestions').hidden=true;
   if(wrongAttempts<=5){
     $('feedback').className='feedback bad';
     $('feedback').textContent=`不正解（${wrongAttempts} / 6回）。あと${6-wrongAttempts}回挑戦できます。`;
     $('guess').value='';
     $('guess').focus();
     return;
   }
 }
 answered=true;
 if(correct){score++;animateOnce($('game'),'victory')}else if(!reviewing)missed.push(question);
 $('score').textContent='SCORE '+score;
 $('feedback').className='feedback '+(correct?'good':'bad');
 $('feedback').textContent=correct?'正解！ '+question.champion:'6回不正解。正解は '+question.champion;
 $('reveal').replaceChildren();
 const img=document.createElement('img');setImage(img,question.portrait);img.alt=question.champion;
 const caption=document.createElement('div');caption.textContent=`${question.champion} — ${question.slot}: ${question.name}`;
 $('reveal').append(img,caption);$('reveal').hidden=false;
 $('guess').disabled=true;$('submit').disabled=true;$('attempts').hidden=true;$('attemptLabel').hidden=true;$('suggestions').hidden=true;
 $('next').style.display='block';$('next').textContent=index===deck.length-1?'結果を見る':'次の問題へ';
}
function advance(){index++;nextQuestion()}
$('form').addEventListener('submit',check);$('guess').addEventListener('input',suggest);$('guess').addEventListener('compositionend',suggest);$('guess').addEventListener('focus',suggest);document.addEventListener('pointerdown',e=>{if(!$('suggestions').contains(e.target)&&e.target!==$('guess'))$('suggestions').hidden=true});$('next').onclick=advance;$('retry').onclick=load;$('review').onclick=()=>start(true);$('kind').onchange=()=>start(false);$('limit').onchange=()=>start(false);load();
</script></body></html>
